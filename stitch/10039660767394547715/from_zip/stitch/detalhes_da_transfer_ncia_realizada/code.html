<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c62f78",
                        "background-light": "#f8f6f7",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-dark text-slate-100 font-display">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-dark max-w-md mx-auto overflow-x-hidden">
<!-- Header -->
<div class="flex items-center bg-background-dark p-4 pb-2 justify-between">
<div class="text-white flex size-12 shrink-0 items-center cursor-pointer" data-icon="ArrowLeft">
<span class="material-symbols-outlined text-3xl">arrow_back</span>
</div>
<h2 class="text-white text-lg font-bold leading-tight tracking-[-0.015em] flex-1">Detalhes do Saque</h2>
</div>
<!-- Success Icon Section -->
<div class="grid grid-cols-1 gap-3 p-4 mt-4">
<div class="flex flex-col items-center gap-3 text-center">
<div class="w-24 h-24 bg-primary/20 rounded-full flex items-center justify-center border-4 border-primary/30">
<div class="w-16 h-16 bg-primary rounded-full flex items-center justify-center shadow-lg shadow-primary/40">
<span class="material-symbols-outlined text-white text-4xl">check</span>
</div>
</div>
</div>
</div>
<!-- Transaction Summary -->
<div class="flex flex-col items-center">
<h1 class="text-white tracking-tight text-[40px] font-bold leading-tight px-4 text-center pb-2 pt-2">R$ 300,00</h1>
<h2 class="text-primary text-lg font-semibold leading-tight tracking-[-0.015em] px-4 text-center pb-6">Transferência Concluída</h2>
</div>
<!-- Details List -->
<div class="px-6 space-y-6">
<div class="flex flex-col gap-1 border-b border-primary/10 pb-4">
<span class="text-slate-400 text-sm">Data e Hora</span>
<span class="text-white font-medium">23/10/2023 - 09:15</span>
</div>
<div class="flex flex-col gap-1 border-b border-primary/10 pb-4">
<span class="text-slate-400 text-sm">Tipo</span>
<span class="text-white font-medium">Saque via PIX (CPF)</span>
</div>
<div class="flex flex-col gap-1 border-b border-primary/10 pb-4">
<span class="text-slate-400 text-sm">Destino</span>
<span class="text-white font-medium">Conta Corrente (Sua conta)</span>
</div>
<div class="flex flex-col gap-1 border-b border-primary/10 pb-4">
<span class="text-slate-400 text-sm">ID da Transação</span>
<div class="flex items-center justify-between">
<span class="text-white font-medium text-xs break-all uppercase">E1234567890987654321</span>
<span class="material-symbols-outlined text-primary text-sm ml-2">content_copy</span>
</div>
</div>
</div>
<!-- View Receipt Option -->
<div class="px-6 pt-10">
<button class="w-full flex items-center justify-center gap-3 py-4 rounded-xl bg-primary/10 border border-primary/20 hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary">picture_as_pdf</span>
<span class="text-primary font-bold">Ver Comprovante Completo</span>
</button>
</div>
<!-- Spacer -->
<div class="flex-grow min-h-[40px]"></div>
<!-- Footer Button -->
<div class="p-6">
<button class="w-full bg-primary text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 active:scale-95 transition-transform">
                Voltar para Carteira
            </button>
</div>
</div>
</body></html>
