<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c62f78",
                        "background-light": "#f8f6f7",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen flex flex-col">
<header class="flex items-center p-4 border-b border-primary/10 bg-background-light dark:bg-background-dark sticky top-0 z-10">
<button class="text-slate-900 dark:text-slate-100 p-2 hover:bg-primary/10 rounded-full transition-colors">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="flex-1 text-center text-lg font-bold mr-10">Transferir Saldo</h1>
</header>
<main class="flex-1 flex flex-col max-w-md mx-auto w-full p-4 gap-6">
<section class="text-center py-6">
<p class="text-slate-500 dark:text-slate-400 text-sm font-medium mb-1">Saldo disponível</p>
<h2 class="text-4xl font-bold tracking-tight text-slate-900 dark:text-white">R$ 450,20</h2>
</section>
<section class="space-y-4">
<div class="flex flex-col gap-2">
<label class="text-sm font-semibold text-slate-700 dark:text-slate-300">Quanto deseja transferir?</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-primary font-bold">R$</span>
<input class="w-full bg-slate-100 dark:bg-primary/5 border border-slate-200 dark:border-primary/20 rounded-xl py-4 pl-12 pr-4 text-2xl font-bold focus:ring-2 focus:ring-primary focus:border-transparent outline-none transition-all text-slate-900 dark:text-white" placeholder="0,00" step="0.01" type="number" value="450.20"/>
</div>
</div>
</section>
<section class="bg-slate-100 dark:bg-primary/5 rounded-xl p-4 border border-slate-200 dark:border-primary/10">
<div class="flex justify-between items-center mb-4">
<h3 class="text-sm font-bold uppercase tracking-wider text-slate-500 dark:text-primary/70">Destinatário (PIX)</h3>
</div>
<div class="flex items-center gap-4">
<div class="size-12 rounded-lg bg-primary/20 flex items-center justify-center text-primary"><span class="material-symbols-outlined" data-icon="payments">payments</span></div>
<div>
<p class="font-bold text-slate-900 dark:text-white">PIX via CPF</p>
<p class="text-sm text-slate-500 dark:text-slate-400">Chave PIX: CPF do titular<br/>CPF: 123.456.789-00</p>
</div>
</div>
</section>
<section class="space-y-3">
<div class="flex justify-between text-sm">
<span class="text-slate-500 dark:text-slate-400">Subtotal</span>
<span class="text-slate-900 dark:text-white font-medium">R$ 450,20</span>
</div>
<div class="flex justify-between text-sm">
<span class="text-slate-500 dark:text-slate-400">Taxa de transferência</span>
<span class="text-primary font-medium">- R$ 0,00</span>
</div>
<div class="h-px bg-slate-200 dark:bg-primary/20 w-full my-2"></div>
<div class="flex justify-between items-center">
<span class="font-bold text-slate-900 dark:text-white">Total a receber</span>
<span class="text-xl font-bold text-primary">R$ 450,20</span>
</div>
</section>
<div class="flex flex-col gap-4 mt-auto pt-6">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl shadow-lg shadow-primary/20 transition-all active:scale-[0.98]">
                Confirmar Transferência
            </button>
</div>
</main>
<footer class="p-4 text-center">
<p class="text-xs text-slate-500 dark:text-slate-600">O saldo será creditado instantaneamente em sua conta via PIX (24h).</p>
</footer>
</body></html>
