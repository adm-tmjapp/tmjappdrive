<!DOCTYPE html>

<html class="dark" lang="pt-BR"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#c62f78",
                        "background-light": "#f8f6f7",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 font-display min-h-screen">
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden max-w-md mx-auto">
<!-- Top App Bar -->
<div class="flex items-center p-4 pb-2 justify-between">
<div class="text-slate-900 dark:text-slate-100 flex size-12 shrink-0 items-center justify-start cursor-pointer">
<span class="material-symbols-outlined">arrow_back</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] flex-1 text-center pr-12">Sucesso</h2>
</div>
<!-- Success Status -->
<div class="flex flex-col items-center px-6 pt-12 pb-16">
<div class="flex items-center justify-center w-24 h-24 rounded-full bg-primary/20 mb-8">
<span class="material-symbols-outlined text-primary !text-6xl">check_circle</span>
</div>
<h2 class="text-slate-900 dark:text-slate-100 tracking-tight text-3xl font-bold leading-tight text-center pb-4">
                Transferência Realizada!
            </h2>
<div class="max-w-[320px] text-center">
<p class="text-slate-600 dark:text-slate-400 text-base font-normal leading-relaxed">
                    O valor de <span class="font-bold text-slate-900 dark:text-slate-100">R$ 450,20</span> foi enviado com sucesso para sua conta via PIX.
                </p>
</div>
</div>
<!-- Image Illustration -->
<!-- Transaction Details -->
<div class="px-6 flex-1">
<div class="bg-slate-100 dark:bg-primary/5 rounded-xl p-6">
<h3 class="text-slate-900 dark:text-slate-100 text-sm font-bold uppercase tracking-wider mb-4 opacity-70">Detalhes da Transação</h3>
<div class="space-y-4">
<div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal">Data e Hora</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold text-right">24/10/2023 - 14:30</p>
</div>
<div class="flex justify-between items-center border-b border-slate-200 dark:border-slate-800 pb-3">
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal">ID da Transação</p>
<p class="text-slate-900 dark:text-slate-100 text-sm font-semibold text-right">E1234567890987654321</p>
</div>
<div class="flex justify-between items-center">
<p class="text-slate-500 dark:text-slate-400 text-sm font-normal">Comprovante</p>
<div class="flex items-center gap-2 text-primary cursor-pointer">
<span class="material-symbols-outlined !text-lg">picture_as_pdf</span>
<p class="text-sm font-semibold">PIX_Comp_45020.pdf</p>
</div>
</div>
</div>
</div>
</div>
<!-- Bottom Button -->
<div class="p-6 mt-auto">
<button class="w-full bg-primary hover:bg-primary/90 text-white font-bold py-4 rounded-xl transition-colors shadow-lg shadow-primary/20 flex items-center justify-center gap-2">
<span class="material-symbols-outlined">wallet</span>
                Voltar para a Carteira
            </button>
</div>
<div class="h-4 bg-transparent"></div>
</div>
</body></html>
